<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Career Bridge{% endblock %}</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #020617;
            color: #e2e8f0;
            line-height: 1.6;
        }

        /* NAVIGATION */

      <nav>

    <h2>Career Bridge</h2>

    <div class="nav-actions">

        {% if session.get("student_id") %}

            <!-- Logged in -->
            <button class="menu-button" onclick="toggleMenu()">
                ☰ Navigate
            </button>

            <a href="/logout" class="account-button logout-button">
                🔓 Logout
            </a>

        {% else %}

            <!-- Not logged in -->
            <a href="/register" class="account-button create-button">
                📝 Create Account
            </a>

            <a href="/login" class="account-button login-button">
                🔐 Login
            </a>

        {% endif %}

    </div>

    {% if session.get("student_id") %}

    <div class="nav-menu" id="navMenu">

        <a href="/">🏠 Home</a>
        <a href="/about">👤 About</a>
        <a href="/dashboard">🎓 Dashboard</a>
        <a href="/services">💼 Services</a>
        <a href="/courses">📚 Courses</a>
        <a href="/opportunities">💼 Opportunities</a>
        <a href="/career-explorer">🧭 Career Explorer</a>
        <a href="/career-quiz">🧭 Career Quiz</a>
        <a href="/cv-builder">📝 CV Builder</a>
        <a href="/library">📚 Library</a>
        <a href="/blog">📢 Blog</a>
        <a href="/contact">📞 Contact</a>

    </div>

    {% endif %}

</nav>

{% block content %}

<h1 style="color: white; text-align: center;">
    TEST — Career Bridge is working
</h1>

{% endblock %}


<footer>

    <p><strong>Career Bridge</strong></p>

    <p>Building skills. Connecting opportunities.</p>

    <p>© 2026 Career Bridge. All rights reserved.</p>

</footer>


<script>

function toggleMenu() {

    document
        .getElementById("navMenu")
        .classList
        .toggle("show");

}

</script>


</body>

</html>
