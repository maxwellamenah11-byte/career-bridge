{% extends "base.html" %}

{% block content %}

<div style="max-width:500px; margin:60px auto; padding:30px;">

```
<h1>Admin Login</h1>

<p>Sign in to manage Career Bridge.</p>

<form method="POST">

    <label>Username</label>

    <input
        type="text"
        name="username"
        required
        style="width:100%; padding:12px; margin:8px 0 20px;"
    >

    <label>Password</label>

    <input
        type="password"
        name="password"
        required
        style="width:100%; padding:12px; margin:8px 0 20px;"
    >

    <button
        type="submit"
        style="padding:12px 25px; border:none; border-radius:8px; cursor:pointer;"
    >
        Login
    </button>

</form>
```

</div>

{% endblock %}
