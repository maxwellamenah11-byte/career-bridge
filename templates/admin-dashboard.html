{% extends "base.html" %}

{% block content %}

<div style="max-width:1000px; margin:50px auto; padding:20px;">

```
<h1>Admin Dashboard</h1>

<p>Welcome, {{ session.get("admin_username") }} 👋</p>

<div style="
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:20px;
    margin-top:30px;
">

    <a href="{{ url_for('add_mentor') }}"
       style="padding:25px; background:white; border-radius:12px; text-decoration:none;">

    </a>

    <a href="{{ url_for('mentors') }}"
       style="padding:25px; background:white; border-radius:12px; text-decoration:none;">
        <h2>👥 View Mentors</h2>
        <p>View the mentors currently listed.</p>
    </a>

</div>
```

</div>
