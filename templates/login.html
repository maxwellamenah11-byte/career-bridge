{% extends "base.html" %}

{% block title %}Login - Career Bridge{% endblock %}

{% block content %}

<section class="page">

    <div class="page-header">

        <h1>🔐 Login</h1>

        <p>
            Welcome back to Career Bridge. Login to continue
            your learning and track your progress.
        </p>

    </div>

    <div class="contact-box">

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="button">
                🔐 Login
            </button>

        </form>

        <p style="margin-top: 20px;">
            Don't have an account?
            <a href="/register">Create Account</a>
        </p>

    </div>

</section>

<style>

.contact-box form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.contact-box input {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #020617;
    color: white;
    font-size: 16px;
}

.contact-box input:focus {
    outline: none;
    border-color: #2563eb;
}

.contact-box button {
    border: none;
    cursor: pointer;
}

.contact-box a {
    color: #60a5fa;
    text-decoration: none;
    font-weight: bold;
}

</style>

{% endblock %}
