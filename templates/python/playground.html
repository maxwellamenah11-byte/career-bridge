<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Playground - Career Bridge</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            box-sizing: border-box;
            background: #1f2937;
            color: white;
            border: 1px solid #4b5563;
            border-radius: 8px;
            font-family: monospace;
            font-size: 16px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .output-box {
            margin-top: 20px;
        }

        pre {
            background: #000;
            color: #00ff88;
            padding: 15px;
            border-radius: 8px;
            min-height: 100px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🐍 Python Playground</h1>

    <p>
        Write your Python code below and click <b>Run Code</b>.
    </p>

    <textarea id="code">name = "Student"
print("Hello", name)

for i in range(5):
    print(i)</textarea>

    <br>

    <button onclick="runPython()">▶ Run Code</button>

    <div class="output-box">
        <h2>Output</h2>
        <pre id="output">Your output will appear here...</pre>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>

<script>
    let pyodide;

    async function loadPython() {
        document.getElementById("output").textContent =
            "Loading Python...";

        pyodide = await loadPyodide();

        document.getElementById("output").textContent =
            "Python is ready. Write your code and click Run Code.";
    }

    async function runPython() {

        if (!pyodide) {
            document.getElementById("output").textContent =
                "Python is still loading. Please wait a moment.";
            return;
        }

        const code = document.getElementById("code").value;
        const output = document.getElementById("output");

        try {

            pyodide.runPython(`
import sys
from io import StringIO

_output = StringIO()
sys.stdout = _output
sys.stderr = _output
`);

            pyodide.runPython(code);

            const result = pyodide.runPython(
                "_output.getvalue()"
            );

            output.textContent = result || "Code ran successfully with no output.";

        } catch (error) {

            output.textContent =
                "Error:\\n" + error;
        }
    }

    loadPython();
</script>

</body>
</html>
